[package]
name = "verilog-format"
version = "1.0.1"
edition = "2021"
description = "CLI formatter for Verilog files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ericsonj/verilog-format"
homepage = "https://github.com/ericsonj/verilog-format"
keywords = ["verilog", "formatter", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**/*"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.21"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.15"
